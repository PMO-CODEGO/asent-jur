services:
  web:
    build: .
    container_name: codego_app
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: always
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mysql:8
    container_name: mysql_sistema
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: codego_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    restart: always

  backup:
    build: ./docker/backup
    container_name: codego_backup
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: codego_db
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx_codego
    ports:
      - "80:80"
    depends_on:
      - web
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/app/uploads
      - ./app/static:/app/static

volumes:
  mysql_data: